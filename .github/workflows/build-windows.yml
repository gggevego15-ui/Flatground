name: Godot Windows Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Validate and export Windows build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/main_menu.tscn
          test -f scripts/main_menu.gd
          test -f scripts/game_settings.gd
          test -f scenes/test_map.tscn
          test -f scenes/player.tscn
          test -f scripts/player_controller.gd
          test -f scripts/test_map.gd

      - name: Import project resources and reject script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:" /tmp/godot-import.log; then
            echo "Godot reported script errors during import." >&2
            exit 1
          fi

      - name: Validate project startup
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-startup.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:" /tmp/godot-startup.log; then
            echo "Godot reported script errors during startup." >&2
            exit 1
          fi

      - name: Install CI utilities and system fonts
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl unzip fontconfig
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache curl unzip fontconfig
          else
            echo "No supported package manager found for CI dependencies" >&2
            exit 1
          fi

      - name: Install matching Windows export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="$(godot --version | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          ARCHIVE="/tmp/godot-export-templates.tpz"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$ARCHIVE"
          mkdir -p /tmp/godot-export-templates
          unzip -q -o "$ARCHIVE" -d /tmp/godot-export-templates
          cp -R /tmp/godot-export-templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/windows_release_x86_64.exe"
          test -f "$TEMPLATE_DIR/windows_debug_x86_64.exe"

      - name: Export Windows executable
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/FlatGROUND.exe 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:" /tmp/godot-export.log; then
            echo "Godot reported script errors during Windows export." >&2
            exit 1
          fi
          test -s build/windows/FlatGROUND.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FlatGROUND-Windows
          path: build/windows/
          if-no-files-found: error
          retention-days: 14
